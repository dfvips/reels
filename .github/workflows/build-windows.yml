name: Build Windows Single EXE (SFX)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ====== 7z SFX 开始 ======
      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Package Release as 7z
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $archive = "build\windows\x64\runner\Release\DouyinParser.7z"
          7z a $archive "$releaseDir\*" -r

      - name: Download 7z SFX module
        shell: pwsh
        run: |
          $sfxUrl = "https://www.7-zip.org/a/7zS.sfx"
          Invoke-WebRequest $sfxUrl -OutFile "build\windows\x64\runner\Release\7zS.sfx"

      - name: Combine SFX + Archive into Single EXE
        shell: pwsh
        run: |
          $sfx = "build\windows\x64\runner\Release\7zS.sfx"
          $archive = "build\windows\x64\runner\Release\DouyinParser.7z"
          $exeOut = "build\windows\x64\runner\Release\DouyinParser.exe"
          Copy-Item $sfx $exeOut -Force
          Add-Content $exeOut -Value ([System.IO.File]::ReadAllBytes($archive))

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-exe
          path: build/windows/x64/runner/Release/DouyinParser.exe
