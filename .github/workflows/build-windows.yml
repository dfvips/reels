name: Build Windows Single EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ 拉取代码
      - uses: actions/checkout@v4

      # 2️⃣ 设置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3️⃣ 启用 Windows 桌面
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 4️⃣ 安装依赖
      - name: Pub Get
        run: flutter pub get

      # 5️⃣ 构建 Windows Release（确保图标已正确放入 resources/app_icon.ico）
      - name: Build Windows
        run: flutter build windows --release

      # 6️⃣ 安装 Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup -y

      # 7️⃣ 读取版本号
      - name: Read version from pubspec.yaml
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:'
          $version = ($versionLine.Line.Split(':')[1].Trim() -split '\+')[0]
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      # 8️⃣ 创建 Inno Setup 脚本（关键：使用中文名称 + 指定图标）
      # 8️⃣ 创建 Inno Setup 脚本（安全写法，避免 YAML 解析错误）
      - name: Create installer script
        shell: pwsh
        run: |
          $appName = "抖音视频解析"
          $exeName = "douyin_parser.exe"
          $iconPath = "windows\runner\resources\app.ico"
          $version = "${{ env.APP_VERSION }}"

          if (-not (Test-Path $iconPath)) {
            Write-Error "图标文件不存在: $iconPath"
            exit 1
          }

          $issContent = @(
            "[Setup]",
            "AppName=$appName",
            "AppVersion=$version",
            "DefaultDirName={pf}\$appName",
            "OutputBaseFilename=抖音视频解析_Setup_v$version",
            "Compression=lzma",
            "SolidCompression=yes",
            "SetupIconFile=$iconPath",
            "UninstallDisplayIcon={app}\$exeName",
            "",
            "[Files]",
            'Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs',
            "",
            "[Icons]",
            "Name: ""{group}\$appName""; Filename: ""{app}\$exeName""; IconFilename: ""{app}\$exeName""",
            "Name: ""{commondesktop}\$appName""; Filename: ""{app}\$exeName""; IconFilename: ""{app}\$exeName""",
            "",
            "[Run]",
            "Filename: ""{app}\$exeName""; Description: ""启动 $appName""; Flags: nowait postinstall skipifsilent"
          )

          $issContent | Set-Content -Path installer.iss -Encoding UTF8

      # 9️⃣ 编译安装包
      - name: Build Installer
        run: iscc installer.iss

      # 🔟 上传 artifact（注意：Windows 路径分隔符）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/抖音视频解析_Setup_v${{ env.APP_VERSION }}.exe