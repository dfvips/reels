name: Build Windows Single EXE (7z SFX Auto)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ===== 生成绿色单 exe =====

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Create single EXE with built-in SFX
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $exeOut = "$releaseDir\DouyinParser.exe"

          # 删除旧文件（防止覆盖失败等）
          if (Test-Path $exeOut) { Remove-Item $exeOut -Force }

          # 生成 SFX 单 exe
          # -sfx = 使用默认 7z 自带 SFX
          & 7z a -sfx $exeOut "$releaseDir\*"

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-exe
          path: build/windows/x64/runner/Release/DouyinParser.exe
