name: Build Windows Single EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ====== 单文件封装开始 ======
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create installer script
        shell: pwsh
        run: |
          Set-Content installer.iss "[Setup]"
          Add-Content installer.iss "AppName=DouyinParser"
          Add-Content installer.iss "AppVersion=1.0.0"
          Add-Content installer.iss "DefaultDirName={pf}\DouyinParser"
          Add-Content installer.iss "OutputBaseFilename=DouyinParser_Setup"
          Add-Content installer.iss "Compression=lzma"
          Add-Content installer.iss "SolidCompression=yes"
          Add-Content installer.iss ""
          Add-Content installer.iss "[Files]"
          Add-Content installer.iss 'Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs'
          Add-Content installer.iss ""
          Add-Content installer.iss "[Icons]"
          Add-Content installer.iss 'Name: "{group}\DouyinParser"; Filename: "{app}\douyin_parser.exe"'

      - name: Build Single EXE Installer
        run: iscc installer.iss

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-single-exe
          path: Output/DouyinParser_Setup.exe
