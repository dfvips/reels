name: Build

# push / PR 自动触发只构建 win-x64；手动 workflow_dispatch 构建全部目标。
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Build · all platforms' || 'Build · win-x64' }}

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_SLUG: douyin_parser
  PRODUCT_NAME: 抖音视频解析
  FLUTTER_VERSION: "3.38.5"

jobs:
  # ================================================================== 触发目标
  # push / PR 只构建 win-x64；手动 workflow_dispatch 构建全部目标。
  prep:
    name: resolve targets
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.targets.outputs.windows }}
    steps:
      - id: targets
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'windows={"include":[{"label":"win-x64","os":"windows-latest"},{"label":"win-arm64","os":"windows-11-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'windows={"include":[{"label":"win-x64","os":"windows-latest"}]}' >> "$GITHUB_OUTPUT"
          fi

  # ================================================================== Android
  android:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-armv7
            target: android-arm
          - label: android-armv8
            target: android-arm64
          - label: android-universal
            target: android-arm,android-arm64,android-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        run: flutter build apk --release --target-platform ${{ matrix.target }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "${{ env.PROJECT_SLUG }}-${{ matrix.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}
          path: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}.apk
          if-no-files-found: error
          retention-days: 30

  # ================================================================== Windows
  # Flutter 没有 32 位 Windows 引擎产物，win-x86 无法构建；
  # win-arm64 需要在 ARM64 机器上原生构建，使用 windows-11-arm runner。
  windows:
    needs: prep
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.windows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: flutter build windows --release

      - name: Package (portable single EXE)
        shell: pwsh
        run: |
          $release = Get-ChildItem "build/windows/*/runner/Release" -Directory |
            Select-Object -First 1
          if (-not $release) { throw "找不到 Release 输出目录" }
          $exe = Get-ChildItem $release.FullName -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "找不到构建产物 exe" }

          $work = Join-Path $env:RUNNER_TEMP "sfx"
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # SFX 模块优先用 runner 预装的 7-Zip，缺失时从官网 extra 包提取
          $sfx = "C:\Program Files\7-Zip\7z.sfx"
          if (-not (Test-Path $sfx)) {
            Invoke-WebRequest "https://www.7-zip.org/a/7z2409-extra.7z" -OutFile "$work\extra.7z"
            7z x "$work\extra.7z" -o"$work" 7z.sfx | Out-Null
            $sfx = "$work\7z.sfx"
          }

          # SFX 配置：静默解压到独立临时目录并启动应用，全程无对话框
          $config = Join-Path $work "config.txt"
          $configLines = @(
            ';!@Install@!UTF-8!'
            'Title="DouyinParser"'
            'RunProgram="' + $exe.Name + '"'
            'Directory="X%%T%%"'
            'GUIMode="2"'
            ';!@InstallEnd@!'
          )
          $configText = ($configLines -join "`r`n") + "`r`n"
          [System.IO.File]::WriteAllText(
            $config,
            $configText,
            [System.Text.UTF8Encoding]::new($false))

          $archive = Join-Path $work "app.7z"
          7z a -t7z $archive "$($release.FullName)\*" | Out-Null

          # 模块 + 配置 + 7z 归档按顺序拼接成绿色单文件 exe
          $sfxBytes = [System.IO.File]::ReadAllBytes($sfx)
          $configBytes = [System.IO.File]::ReadAllBytes($config)
          $archiveBytes = [System.IO.File]::ReadAllBytes($archive)
          $all = New-Object byte[] ($sfxBytes.Length + $configBytes.Length + $archiveBytes.Length)
          [Array]::Copy($sfxBytes, 0, $all, 0, $sfxBytes.Length)
          [Array]::Copy($configBytes, 0, $all, $sfxBytes.Length, $configBytes.Length)
          [Array]::Copy($archiveBytes, 0, $all, $sfxBytes.Length + $configBytes.Length, $archiveBytes.Length)
          [System.IO.File]::WriteAllBytes("${{ env.PROJECT_SLUG }}-${{ matrix.label }}.exe", $all)
          "{0} 已生成（{1:N1} MB）" -f "${{ env.PROJECT_SLUG }}-${{ matrix.label }}.exe",
            ((Get-Item "${{ env.PROJECT_SLUG }}-${{ matrix.label }}.exe").Length / 1MB) | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}
          path: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}.exe
          if-no-files-found: error
          retention-days: 30

  # ================================================================== macOS
  # 签名流程参考 ykparser：SIGNING_CERT（Base64 PKCS#12）+ SIGNING_CERT_PASSWORD
  # 导入临时钥匙串后 codesign；未配置证书时回退 ad-hoc 签名。
  # DMG 按 requirement 不加签。
  macos:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mac-x64
            os: macos-15-intel
          - label: mac-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: flutter build macos --release

      - name: Assemble & sign macOS app bundle
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          APP_SRC="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          APP="${GITHUB_WORKSPACE}/${PRODUCT_NAME}.app"
          cp -R "${APP_SRC}" "${APP}"

          VERSION="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)"
          PLIST="${APP}/Contents/Info.plist"
          plutil -replace CFBundleName -string "${PRODUCT_NAME}" "${PLIST}"
          plutil -replace CFBundleDisplayName -string "${PRODUCT_NAME}" "${PLIST}"
          plutil -replace CFBundleShortVersionString -string "${VERSION}" "${PLIST}"
          plutil -replace CFBundleVersion -string "${VERSION}" "${PLIST}"
          plutil -lint "${PLIST}"

          # ---------- 导入签名证书到临时钥匙串 ----------
          SIGN_IDENTITY="-"
          KEYCHAIN=""
          if [[ -n "${SIGNING_CERT:-}" ]]; then
            echo "==> 使用 Secrets 中的 SIGNING_CERT（Base64 PKCS#12）签名"
            if [[ -z "${SIGNING_CERT_PASSWORD:-}" ]]; then
              echo "::error::缺少 SIGNING_CERT_PASSWORD"
              exit 1
            fi
            KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
            CERT_PATH="${RUNNER_TEMP}/macos_cert.p12"

            printf '%s' "${SIGNING_CERT}" | base64 --decode > "${CERT_PATH}"
            if [[ ! -s "${CERT_PATH}" ]]; then
              echo "::error::SIGNING_CERT 解码后为空，请检查是否为 .p12 的 Base64 内容"
              exit 1
            fi

            security create-keychain -p "" "${KEYCHAIN}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN}"
            security unlock-keychain -p "" "${KEYCHAIN}"
            security import "${CERT_PATH}" -P "${SIGNING_CERT_PASSWORD}" \
              -A -t cert -f pkcs12 -k "${KEYCHAIN}"
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "${KEYCHAIN}"
            security list-keychains -d user -s "${KEYCHAIN}"

            SIGN_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" | head -n 1 | awk '{print $2}')"
            if [[ -z "${SIGN_IDENTITY}" ]]; then
              echo "::error::PKCS#12 已导入，但钥匙串中没有可用的 codesigning identity"
              security find-identity -v -p codesigning "${KEYCHAIN}"
              exit 1
            fi
            echo "==> 已选择 codesigning identity：${SIGN_IDENTITY}"
          else
            echo "::warning::未配置 SIGNING_CERT，使用 ad-hoc 签名（仅本机可运行，未公证）"
          fi

          # ---------- 签署并验证 .app ----------
          if [[ "${SIGN_IDENTITY}" == "-" ]]; then
            codesign --force --deep --options runtime \
              --entitlements macos/Runner/Release.entitlements \
              --sign "-" "${APP}"
          else
            codesign --force --deep --options runtime --timestamp \
              --entitlements macos/Runner/Release.entitlements \
              --sign "${SIGN_IDENTITY}" "${APP}"
          fi
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dv --verbose=4 "${APP}" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)=' || true

          echo "SIGN_IDENTITY=${SIGN_IDENTITY}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=${KEYCHAIN}" >> "$GITHUB_ENV"

      - name: Package (app + unsigned DMG + zip)
        run: |
          set -euo pipefail
          APP="${GITHUB_WORKSPACE}/${PRODUCT_NAME}.app"
          DMG="${GITHUB_WORKSPACE}/${PROJECT_SLUG}-${{ matrix.label }}.dmg"
          ZIP="${GITHUB_WORKSPACE}/${PROJECT_SLUG}-${{ matrix.label }}.zip"

          mkdir -p dmg-stage
          cp -R "${APP}" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "${PRODUCT_NAME}" -srcfolder dmg-stage \
            -ov -format UDZO "${DMG}" > /dev/null
          rm -rf dmg-stage

          # DMG 不加签，zip 内含签名后的 .app 与未签名 .dmg
          zip -qry "${ZIP}" "${PRODUCT_NAME}.app" "${DMG}"
          ls -lh "${ZIP}"

      - name: Delete temporary keychain
        if: env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" || true
          echo "==> 临时钥匙串已删除"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}
          path: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 30

  # ================================================================== iOS
  ios:
    if: github.event_name == 'workflow_dispatch'
    name: ios-unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "${{ env.PROJECT_SLUG }}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "${{ env.PROJECT_SLUG }}-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-ios-unsigned
          path: ${{ env.PROJECT_SLUG }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
