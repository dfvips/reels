name: Build

# push / PR / 手动触发均构建全部平台目标。
run-name: Build · all platforms

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_SLUG: douyin_parser
  PRODUCT_NAME: 抖音视频解析
  FLUTTER_VERSION: "3.38.5"

jobs:
  # ================================================================== 版本
  # 版本使用语义化版本 X.Y.Z：以 pubspec.yaml 的版本为种子，
  # 每次构建基于最新的 vX.Y.Z tag 自动 +1；手动调大 pubspec 版本
  # 时以 pubspec 为准。build number 固定为 run_number 保证递增。
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.base }}
      build: ${{ steps.v.outputs.build }}
      full: ${{ steps.v.outputs.full }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          pubspec_base="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)"

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            # 手动打 v* tag 时沿用 tag 版本
            BASE="${REF_NAME#v}"
            TAG="v${BASE}"
          else
            # 取仓库中最新的语义化 tag（忽略日期等旧格式）
            latest_tag="$(git ls-remote --tags origin 'v*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1 || true)"

            if [[ -n "$latest_tag" ]]; then
              latest="${latest_tag#v}"
              if [[ "$(printf '%s\n%s\n' "$latest" "$pubspec_base" | sort -V | tail -n 1)" == "$pubspec_base" && "$pubspec_base" != "$latest" ]]; then
                # pubspec 手动调大（如 1.1.0）：直接沿用
                BASE="$pubspec_base"
              else
                IFS=. read -r MAJOR MINOR PATCH <<< "$latest"
                BASE="$MAJOR.$MINOR.$((PATCH + 1))"
              fi
            else
              BASE="$pubspec_base"
            fi

            TAG="v${BASE}"
            # tag 已被占用（并发构建）时继续递增，避免发布冲突
            while git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; do
              IFS=. read -r MAJOR MINOR PATCH <<< "${TAG#v}"
              BASE="$MAJOR.$MINOR.$((PATCH + 1))"
              TAG="v${BASE}"
            done
          fi

          {
            echo "base=${BASE}"
            echo "build=${BUILD_NUMBER}"
            echo "full=${BASE}+${BUILD_NUMBER}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "版本: ${BASE}（tag ${TAG}，build ${BUILD_NUMBER}）"

  # ================================================================== Android
  android:
    needs: version
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-armv7
            target: android-arm
          - label: android-armv8
            target: android-arm64
          - label: android-universal
            target: android-arm,android-arm64,android-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject version
        run: |
          sed -i.bak "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Build APK
        run: flutter build apk --release --target-platform ${{ matrix.target }} --dart-define=APP_VERSION=${{ needs.version.outputs.base }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "${{ env.PROJECT_SLUG }}-${{ matrix.label }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}
          path: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}.apk
          if-no-files-found: error
          retention-days: 30

  # ================================================================== Windows
  # Flutter 没有 32 位 Windows 引擎产物，win-x86 无法构建。
  # win-arm64 采用 windows-11-arm 原生 runner + flutter main 固定 commit
  # 构建（参考 Gopeed 的成熟方案：llvm-mingw 提供 C/C++ 工具链，
  # 构建后补齐 clang-mingw 与 VC 运行库 DLL）。
  windows:
    needs: version
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win-x64
            os: windows-latest
            package: exe
          - label: win-arm64
            os: windows-11-arm
            flutter_channel: main
            flutter_version: "7e1c8868"
            llvm_ver: "20251202"
            package: zip
    steps:
      - uses: actions/checkout@v4

      - name: Enable long paths (flutter main checkout)
        if: matrix.label == 'win-arm64'
        run: git config --global core.longpaths true

      - name: Install llvm-mingw-ucrt-aarch64 (win-arm64 only)
        if: matrix.label == 'win-arm64'
        shell: pwsh
        run: |
          $ver = "${{ matrix.llvm_ver }}"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-aarch64.zip"
          $zip = "$env:RUNNER_TEMP\llvm.zip"
          $extract = "$env:RUNNER_TEMP\extract"
          $target = "C:\clangarm64"
          Invoke-WebRequest $url -OutFile $zip
          foreach ($dir in @($extract, $target)) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xf $zip -C $extract
          Move-Item (Get-ChildItem $extract)[0].FullName $target
          $b = "$target\bin"
          "CC=$b\clang.exe" >> $env:GITHUB_ENV
          "CXX=$b\clang++.exe" >> $env:GITHUB_ENV
          "CLANGARM64_ROOT=$target" >> $env:GITHUB_ENV
          $b >> $env:GITHUB_PATH

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version || env.FLUTTER_VERSION }}
          channel: ${{ matrix.flutter_channel || 'stable' }}
          cache: true

      - name: Inject version
        shell: pwsh
        run: |
          $full = '${{ needs.version.outputs.full }}'
          (Get-Content pubspec.yaml) -replace '^version: .*', ('version: ' + $full) |
            Set-Content pubspec.yaml
          Select-String '^version:' pubspec.yaml | Write-Host

      - name: Build
        env:
          APP_VERSION: ${{ needs.version.outputs.base }}
        run: flutter build windows --release --dart-define="APP_VERSION=$env:APP_VERSION"

      - name: Copy runtime DLLs (win-arm64 only)
        if: matrix.label == 'win-arm64'
        shell: pwsh
        run: |
          $release = "build\windows\arm64\runner\Release\"
          if (-not (Test-Path $release)) { throw "未找到 arm64 Release 目录" }
          $mingw = "$env:CLANGARM64_ROOT\aarch64-w64-mingw32\bin"
          foreach ($dll in @("libc++.dll", "libunwind.dll", "libwinpthread-1.dll")) {
            Copy-Item "$mingw\$dll" $release
          }
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "C:\Windows\System32\$dll" $release
          }

      # EVB 仅支持 x86/x64 PE 输入，无法处理 ARM64 exe
      - name: Package (Enigma Virtual Box single EXE)
        if: matrix.label == 'win-x64'
        shell: pwsh
        run: |
          $release = Get-ChildItem "build/windows/*/runner/Release" -Directory |
            Select-Object -First 1
          if (-not $release) { throw "找不到 Release 输出目录" }
          $exe = Get-ChildItem $release.FullName -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "找不到构建产物 exe" }

          # 下载并静默安装 Enigma Virtual Box（免费版自带 enigmavbconsole.exe 命令行编译器）
          $evbDir = Join-Path $env:RUNNER_TEMP "evb"
          $installer = Join-Path $env:RUNNER_TEMP "enigmavb.exe"
          Invoke-WebRequest "https://enigmaprotector.com/assets/files/enigmavb.exe" -OutFile $installer
          # /CU 走当前用户安装、免提权；/DIR 按 Inno Setup 文档要求不带引号
          # 注意：逗号优先级低于 +，/DIR 参数必须先拼接好再放进数组，否则会被拆成独立元素
          $dirArg = '/DIR=' + $evbDir
          $setupArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CU', $dirArg
          $setup = Start-Process -FilePath $installer -ArgumentList $setupArgs -Wait -PassThru
          "EVB 安装器退出码：$($setup.ExitCode)" | Write-Host

          # 安装器偶尔落到默认目录，做兜底定位
          $console = $null
          foreach ($candidate in @(
              (Join-Path $evbDir "enigmavbconsole.exe"),
              "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe",
              "C:\Program Files\Enigma Virtual Box\enigmavbconsole.exe")) {
            if (Test-Path $candidate) { $console = $candidate; break }
          }
          if (-not $console) {
            Get-ChildItem $evbDir -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name | Write-Host
            throw "EVB 安装失败：未找到 enigmavbconsole.exe（安装器退出码 $($setup.ExitCode)）"
          }

          # 递归生成虚拟文件系统 XML（跳过主 exe 本身）
          function ConvertTo-EvbFilesXml {
            param([string]$Dir, [string]$MainExe)
            $parts = @()
            foreach ($item in (Get-ChildItem -LiteralPath $Dir | Sort-Object Name)) {
              if ($item.FullName -eq $MainExe) { continue }
              if ($item.PSIsContainer) {
                $parts += '<File><Type>3</Type><Name>' + $item.Name + '</Name>' +
                  '<Action>0</Action><OverwriteDateTime>False</OverwriteDateTime>' +
                  '<OverwriteAttributes>False</OverwriteAttributes>' +
                  '<HideFromDialogs>0</HideFromDialogs>' +
                  '<Files>' + (ConvertTo-EvbFilesXml -Dir $item.FullName -MainExe $MainExe) + '</Files></File>'
              } else {
                $parts += '<File><Type>2</Type><Name>' + $item.Name + '</Name>' +
                  '<File>' + $item.FullName + '</File>' +
                  '<ActiveX>False</ActiveX><ActiveXInstall>False</ActiveXInstall>' +
                  '<Action>0</Action><OverwriteDateTime>False</OverwriteDateTime>' +
                  '<OverwriteAttributes>False</OverwriteAttributes>' +
                  '<PassCommandLine>False</PassCommandLine>' +
                  '<HideFromDialogs>0</HideFromDialogs></File>'
              }
            }
            return -join $parts
          }

          $outputExe = Join-Path (Get-Location) ("${{ env.PROJECT_SLUG }}-${{ matrix.label }}.exe")
          $filesXml = ConvertTo-EvbFilesXml -Dir $release.FullName -MainExe $exe.FullName

          # .evb 项目文件：UTF-16LE + BOM，与 EVB GUI 保存格式一致
          $xmlLines = @(
            '<?xml version="1.0" encoding="utf-16"?>'
            '<>'
            '<InputFile>' + $exe.FullName + '</InputFile>'
            '<OutputFile>' + $outputExe + '</OutputFile>'
            '<Files>'
            '<Enabled>True</Enabled>'
            '<DeleteExtractedOnExit>True</DeleteExtractedOnExit>'
            '<CompressFiles>True</CompressFiles>'
            '<Files>'
            '<File><Type>3</Type><Name>%DEFAULT FOLDER%</Name><Action>0</Action>'
            '<OverwriteDateTime>False</OverwriteDateTime>'
            '<OverwriteAttributes>False</OverwriteAttributes>'
            '<HideFromDialogs>0</HideFromDialogs>'
            '<Files>' + $filesXml + '</Files>'
            '</File>'
            '</Files>'
            '</Files>'
            '<Registries>'
            '<Enabled>False</Enabled>'
            '<Registries>'
            '<Registry><Type>1</Type><Virtual>True</Virtual><Name>Classes</Name>' +
              '<ValueType>0</ValueType><Value/><Registries/></Registry>'
            '<Registry><Type>1</Type><Virtual>True</Virtual><Name>User</Name>' +
              '<ValueType>0</ValueType><Value/><Registries/></Registry>'
            '<Registry><Type>1</Type><Virtual>True</Virtual><Name>Machine</Name>' +
              '<ValueType>0</ValueType><Value/><Registries/></Registry>'
            '<Registry><Type>1</Type><Virtual>True</Virtual><Name>Users</Name>' +
              '<ValueType>0</ValueType><Value/><Registries/></Registry>'
            '<Registry><Type>1</Type><Virtual>True</Virtual><Name>Config</Name>' +
              '<ValueType>0</ValueType><Value/><Registries/></Registry>'
            '</Registries>'
            '</Registries>'
            '<Packaging>'
            '<Enabled>False</Enabled>'
            '</Packaging>'
            '<Options>'
            '<ShareVirtualSystem>False</ShareVirtualSystem>'
            '<MapExecutableWithTemporaryFile>True</MapExecutableWithTemporaryFile>'
            '<TemporaryFileMask/>'
            '<AllowRunningOfVirtualExeFiles>True</AllowRunningOfVirtualExeFiles>'
            '<ProcessesOfAnyPlatforms>False</ProcessesOfAnyPlatforms>'
            '</Options>'
            '<Storage>'
            '<Files>'
            '<Enabled>False</Enabled>'
            '<Folder>%DEFAULTFOLDER%\</Folder>'
            '<RandomFileNames>False</RandomFileNames>'
            '<EncryptContent>False</EncryptContent>'
            '</Files>'
            '</Storage>'
            '</>'
          )
          $xml = $xmlLines -join "`r`n"
          $project = Join-Path $env:RUNNER_TEMP "douyin_parser.evb"
          [System.IO.File]::WriteAllText($project, $xml, [System.Text.Encoding]::Unicode)

          # 命令行编译为虚拟化单文件 exe：依赖打包进虚拟文件系统，运行时内存挂载，
          # 无解压过程、无对话框，双击直接打开软件
          & $console $project
          $consoleExit = $LASTEXITCODE
          if ($consoleExit -ne 0) { throw "enigmavbconsole 失败，退出码 $consoleExit" }
          if (-not (Test-Path $outputExe)) { throw "未生成打包后的 exe" }

          "{0} 已生成（{1:N1} MB）" -f (Split-Path $outputExe -Leaf),
            ((Get-Item $outputExe).Length / 1MB) | Write-Host

      # ARM64：便携 zip（exe 改为纯净中文名，依赖全部随包）
      - name: Package (portable zip)
        if: matrix.label == 'win-arm64'
        shell: pwsh
        run: |
          $release = Get-ChildItem "build/windows/*/runner/Release" -Directory |
            Select-Object -First 1
          if (-not $release) { throw "找不到 Release 输出目录" }
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$($release.FullName)\*" $stage -Recurse -Force
          $exe = Get-ChildItem $stage -Filter *.exe | Select-Object -First 1
          Rename-Item $exe.FullName "抖音视频解析.exe"
          Compress-Archive -Path "$stage\*" `
            -DestinationPath "${{ env.PROJECT_SLUG }}-${{ matrix.label }}.zip" -Force
          "douyin_parser-win-arm64.zip 已生成（{0:N1} MB）" -f `
            ((Get-Item "${{ env.PROJECT_SLUG }}-${{ matrix.label }}.zip").Length / 1MB) |
            Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}
          path: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}.${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  # ================================================================== macOS
  # 签名流程参考 ykparser：SIGNING_CERT（Base64 PKCS#12）+ SIGNING_CERT_PASSWORD
  # 导入临时钥匙串后 codesign；未配置证书时回退 ad-hoc 签名。
  # DMG 按 requirement 不加签。
  macos:
    needs: version
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mac-x64
            os: macos-15-intel
          - label: mac-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject version
        run: |
          sed -i.bak "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Build
        run: flutter build macos --release --dart-define=APP_VERSION=${{ needs.version.outputs.base }}

      - name: Assemble & sign macOS app bundle
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          APP_SRC="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          APP="${GITHUB_WORKSPACE}/${PRODUCT_NAME}.app"
          cp -R "${APP_SRC}" "${APP}"

          VERSION="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)"
          PLIST="${APP}/Contents/Info.plist"
          plutil -replace CFBundleName -string "${PRODUCT_NAME}" "${PLIST}"
          plutil -replace CFBundleDisplayName -string "${PRODUCT_NAME}" "${PLIST}"
          plutil -replace CFBundleShortVersionString -string "${VERSION}" "${PLIST}"
          plutil -replace CFBundleVersion -string "${VERSION}" "${PLIST}"
          plutil -lint "${PLIST}"

          # ---------- 导入签名证书到临时钥匙串 ----------
          SIGN_IDENTITY="-"
          KEYCHAIN=""
          if [[ -n "${SIGNING_CERT:-}" ]]; then
            echo "==> 使用 Secrets 中的 SIGNING_CERT（Base64 PKCS#12）签名"
            if [[ -z "${SIGNING_CERT_PASSWORD:-}" ]]; then
              echo "::error::缺少 SIGNING_CERT_PASSWORD"
              exit 1
            fi
            KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
            CERT_PATH="${RUNNER_TEMP}/macos_cert.p12"

            printf '%s' "${SIGNING_CERT}" | base64 --decode > "${CERT_PATH}"
            if [[ ! -s "${CERT_PATH}" ]]; then
              echo "::error::SIGNING_CERT 解码后为空，请检查是否为 .p12 的 Base64 内容"
              exit 1
            fi

            security create-keychain -p "" "${KEYCHAIN}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN}"
            security unlock-keychain -p "" "${KEYCHAIN}"
            security import "${CERT_PATH}" -P "${SIGNING_CERT_PASSWORD}" \
              -A -t cert -f pkcs12 -k "${KEYCHAIN}"
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "${KEYCHAIN}"
            security list-keychains -d user -s "${KEYCHAIN}"

            SIGN_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" | head -n 1 | awk '{print $2}')"
            if [[ -z "${SIGN_IDENTITY}" ]]; then
              echo "::error::PKCS#12 已导入，但钥匙串中没有可用的 codesigning identity"
              security find-identity -v -p codesigning "${KEYCHAIN}"
              exit 1
            fi
            echo "==> 已选择 codesigning identity：${SIGN_IDENTITY}"
          else
            echo "::warning::未配置 SIGNING_CERT，使用 ad-hoc 签名（仅本机可运行，未公证）"
          fi

          # ---------- 签署并验证 .app ----------
          if [[ "${SIGN_IDENTITY}" == "-" ]]; then
            codesign --force --deep --options runtime \
              --entitlements macos/Runner/Release.entitlements \
              --sign "-" "${APP}"
          else
            codesign --force --deep --options runtime --timestamp \
              --entitlements macos/Runner/Release.entitlements \
              --sign "${SIGN_IDENTITY}" "${APP}"
          fi
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dv --verbose=4 "${APP}" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)=' || true

          echo "SIGN_IDENTITY=${SIGN_IDENTITY}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=${KEYCHAIN}" >> "$GITHUB_ENV"

      - name: Package (unsigned DMG + zip)
        run: |
          set -euo pipefail
          APP="${GITHUB_WORKSPACE}/${PRODUCT_NAME}.app"
          # zip 内 dmg 用纯净中文名；架构区分只体现在 zip 文件名上
          DMG="${GITHUB_WORKSPACE}/${PRODUCT_NAME}.dmg"
          ZIP="${GITHUB_WORKSPACE}/${PROJECT_SLUG}-${{ matrix.label }}.zip"

          mkdir -p dmg-stage
          cp -R "${APP}" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "${PRODUCT_NAME}" -srcfolder dmg-stage \
            -ov -format UDZO "${DMG}" > /dev/null
          rm -rf dmg-stage

          # DMG 不加签；zip 内仅含未签名 .dmg（挂载后的 dmg 内含签名后的 .app）
          # 系统自带 zip 对中文名不写 UTF-8(EFS) 标志，Linux/Windows 解压会乱码；
          # 改用 Homebrew Info-ZIP 3.0（写入 EFS 标志）
          brew install zip
          HOMEZIP="$(brew --prefix)/opt/zip/bin/zip"
          # 用相对文件名打包：绝对路径会被 zip 原样存成 Users/runner/... 层级
          "$HOMEZIP" -qry "${ZIP}" "${PRODUCT_NAME}.dmg"
          ls -lh "${ZIP}"

      - name: Delete temporary keychain
        if: env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" || true
          echo "==> 临时钥匙串已删除"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}
          path: ${{ env.PROJECT_SLUG }}-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 30

  # ================================================================== iOS
  ios:
    needs: version
    name: ios-unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject version
        run: |
          sed -i.bak "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=${{ needs.version.outputs.base }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "${{ env.PROJECT_SLUG }}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "${{ env.PROJECT_SLUG }}-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-ios-unsigned
          path: ${{ env.PROJECT_SLUG }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # ================================================================== Release
  # push（main / v* tag）构建成功后自动发布 Release。
  # 资产全部为「英文 + 架构」命名的 zip；zip 内文件统一为
  # 「抖音视频解析 + 扩展名」，架构后缀仅体现在 zip 文件名上。
  release:
    name: publish release
    needs: [version, android, windows, macos, ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Windows：x64 单文件 exe 装入 zip；
          # arm64 便携 zip（EVB 不支持 ARM64 输入），内部 exe 已命名「抖音视频解析.exe」
          mkdir -p exe-x64
          cp artifacts/douyin_parser-win-x64/douyin_parser-win-x64.exe \
            "exe-x64/${PRODUCT_NAME}.exe"
          (cd exe-x64 && zip -qry \
            "../release/douyin_parser-win-x64.zip" "${PRODUCT_NAME}.exe")
          cp artifacts/douyin_parser-win-arm64/douyin_parser-win-arm64.zip release/

          # Android：三个 apk 均装入对应 zip
          for abi in universal armv7 armv8; do
            mkdir -p "apk-$abi"
            cp "artifacts/douyin_parser-android-$abi/douyin_parser-android-$abi.apk" \
              "apk-$abi/${PRODUCT_NAME}.apk"
            (cd "apk-$abi" && zip -qry \
              "../release/douyin_parser-android-$abi.zip" "${PRODUCT_NAME}.apk")
          done

          # iOS：ipa 装入 zip
          mkdir -p ipa-stage
          cp artifacts/douyin_parser-ios-unsigned/douyin_parser-ios-unsigned.ipa \
            "ipa-stage/${PRODUCT_NAME}.ipa"
          (cd ipa-stage && zip -qry \
            "../release/douyin_parser-ios.zip" "${PRODUCT_NAME}.ipa")

          # macOS：zip 保持现有命名（内含「抖音视频解析.app」与「抖音视频解析.dmg」）
          cp artifacts/douyin_parser-mac-x64/douyin_parser-mac-x64.zip release/
          cp artifacts/douyin_parser-mac-arm64/douyin_parser-mac-arm64.zip release/
          ls -lh release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.base }}
        run: |
          gh release create "$TAG" release/* \
            -R "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "抖音视频解析 $VERSION" \
            --notes "自动构建 ${{ github.event_name }} @ ${{ github.sha }}" \
            --latest
