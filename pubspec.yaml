name: douyin_parser
description: 解析抖音视频链接的工具

version: 1.0.1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  
  # 移除或替换 flutter_js
  # flutter_js: 0.8.2  # 这个插件有问题，使用替代方案
  
  # 使用 webview 或 js_eval 替代
  webview_flutter: ^4.2.2  # 或者使用 js_eval: ^0.8.1
  
  cached_network_image: ^3.4.1
  path_provider: ^2.1.1
  photo_view: ^0.15.0
  dio: ^5.8.0+1
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  file_picker: ^10.2.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  
  gal: ^2.3.1
  
  # 添加必要的其他依赖
  bot_toast: ^4.0.1
  open_file: ^3.5.10
  url_launcher: ^6.2.2
  path: ^1.9.1
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"