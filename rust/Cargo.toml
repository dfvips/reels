[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
regex = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "cookies",
    "json",
] }
md-5 = "0.10"
rand = "0.9"
sha2 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
