[workspace]
resolver = "2"
members = ["crates/ui", "crates/input", "apps/desktop", "apps/ios", "apps/android"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
douyin-core = { path = "../crates/core" }
gpui = { package = "sotf-gpui-toolkit-gpui", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.2.3", default-features = false, features = ["windows-manifest"] }
gpui-macos = { package = "sotf-gpui-toolkit-gpui-macos", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.2" }
gpui-miniapp = { git = "https://github.com/pierreaubert/gpui-toolkit", version = "0.11" }
gpui-ui-kit = { git = "https://github.com/pierreaubert/gpui-toolkit", version = "0.11", default-features = false }
gpui-ios = { git = "https://github.com/pierreaubert/gpui-toolkit", version = "0.11" }
gpui-android = { git = "https://github.com/pierreaubert/gpui-toolkit", version = "0.11" }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
