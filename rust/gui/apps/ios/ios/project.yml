name: Reels
options:
  bundleIdPrefix: com.dreamfly
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_OBJC_BRIDGING_HEADER: Reels/BridgingHeader.h
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_BITCODE: NO

targets:
  Reels:
    type: application
    platform: iOS
    sources:
      - path: Reels
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamfly.reels
        PRODUCT_NAME: Reels
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        MARKETING_VERSION: "1.0.25"
        CURRENT_PROJECT_VERSION: "25"
        INFOPLIST_FILE: Reels/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/lib"
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(PROJECT_DIR)/lib/libreels_ios.a"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Photos"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "IOSurface"
          - "-lc++"
    scheme:
      testTargets: []
