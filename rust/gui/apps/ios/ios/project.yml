name: DouyinParser
options:
  bundleIdPrefix: com.dreamfly
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_OBJC_BRIDGING_HEADER: DouyinParser/BridgingHeader.h
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_BITCODE: NO

targets:
  DouyinParser:
    type: application
    platform: iOS
    sources:
      - path: DouyinParser
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreamfly.douyinParser
        PRODUCT_NAME: 抖音视频解析
        INFOPLIST_FILE: DouyinParser/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/lib"
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(PROJECT_DIR)/lib/libdouyin_parser_ios.a"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "IOSurface"
          - "-lc++"
    scheme:
      testTargets: []
