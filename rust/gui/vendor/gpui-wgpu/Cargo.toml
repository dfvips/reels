[package]
name = "sotf-gpui-toolkit-gpui-wgpu"
version = "0.1.3"
edition = "2024"
description = "GPUI wgpu renderer"
license = "Apache-2.0"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
readme = "VENDORING.md"
keywords = ["graphics", "gpu", "wgpu"]
categories = ["graphics", "rendering"]

[lib]
name = "gpui_wgpu"
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]
# Enables the offscreen renderer used by adapter-backed GPUI visual QA.
headless-qa = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { package = "sotf-gpui-toolkit-gpui", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.2.3", default-features = false }
anyhow = "1.0"
bytemuck = "1"
collections = { package = "sotf-collections", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
cosmic-text = { version = "0.19.0", package = "sotf-cosmic-text", git = "https://github.com/pierreaubert/sotf-3rdparties" }
etagere = "0.3"
itertools = "0.15.0"
log = "0.4"
parking_lot = "0.13"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-segmentation = "1.10"
gpui_util = { package = "sotf-gpui_util", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "0.1.0" }
wgpu = { package = "sotf-wgpu", git = "https://github.com/pierreaubert/sotf-3rdparties", version = "29.0.3" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"], optional = true }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/pierreaubert/sotf-3rdparties", package = "sotf-zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

# Intentionally not inheriting [workspace.lints]: it enables the clippy
# pedantic group, which this vendored upstream code does not target.
# The zero-warnings gate (issue #6) runs default rustc/clippy lints.
[lints]
